
<!DOCTYPE html>
<html>
<head>
    <title>Lab 10 - Task 3</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <h2>Running Total of Unhealthy Days - 2025</h2>

    <div id="info"></div>

    <div id="chart"></div>

    <script>

        const parseDate = d3.timeParse("%Y-%m-%d");

        d3.csv("air_quality_2025.csv").then(data => {

            data.forEach(d => {
                d.date = parseDate(d.date);
                d.pm25_city = +d.pm25_city;

                d.unhealthy = d.pm25_city > 75 ? 1 : 0;
            });

            data.sort((a, b) => a.date - b.date);

            let totals = d3.cumsum(data, d => d.unhealthy);

            data.forEach((d, i) => {
                d.runningTotal = totals[i];
            });

            let finalTotal = data[data.length - 1].runningTotal;

            d3.select("#info")
                .html(`<p>Total Unhealthy Days: ${finalTotal}</p>`);

            const width = 900;
            const height = 500;

            const margin = {
                top: 30,
                right: 30,
                bottom: 60,
                left: 70
            };

            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width)
                .attr("height", height);

            const x = d3.scaleTime()
                .domain(d3.extent(data, d => d.date))
                .range([margin.left, width - margin.right]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.runningTotal)])
                .range([height - margin.bottom, margin.top]);

            svg.append("g")
                .attr("transform", `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(x));

            svg.append("g")
                .attr("transform", `translate(${margin.left},0)`)
                .call(d3.axisLeft(y));

            const area = d3.area()
                .x(d => x(d.date))
                .y0(y(0))
                .y1(d => y(d.runningTotal));

            svg.append("path")
                .datum(data)
                .attr("fill", "steelblue")
                .attr("opacity", 0.6)
                .attr("d", area);

        })
        .catch(error => {
            d3.select("#info")
                .text("Error loading CSV: " + error.message);

            console.log(error);
        });

    </script>

</body>
</html>
